<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Territorial - 13 de Setembro</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --sidebar-width: 280px;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: var(--sidebar-width); background: #fff; display: flex; flex-direction: column; box-shadow: 4px 0 10px rgba(0,0,0,0.05); }
        .sidebar-header { background: var(--primary-color); padding: 20px; color: white; border-bottom: 4px solid var(--accent-color); }
        
        .menu-container { flex: 1; overflow-y: auto; padding: 10px 0; }
        .menu-section { padding: 15px 20px 5px; font-size: 11px; font-weight: bold; color: #adb5bd; text-transform: uppercase; }
        
        .nav-button { padding: 12px 20px; text-decoration: none; color: var(--primary-color); display: flex; border-left: 4px solid transparent; }
        .nav-button:hover { background: #f1f3f5; }
        .nav-button.active { background: #e7f3ff; border-left-color: var(--accent-color); color: var(--accent-color); font-weight: 600; }

        .content { flex: 1; display: flex; flex-direction: column; }
        iframe { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0; font-size: 16px;">PAINEL TERRITORIAL</h2>
        <span style="font-size:10px;">13 DE SETEMBRO</span>
    </div>

    <div class="menu-container">
        <div class="menu-section">Mapas e Território</div>
        <a href="Territorio_13_Setembro.html" target="view" class="nav-button">📍 Visão Geral</a>
        <a href="Mapa_CRAS.html" target="view" class="nav-button">🏠 Rede CRAS</a>
        <a href="Mapa_CREAS.html" target="view" class="nav-button">🛡️ Rede CREAS</a>
        <a href="Mapa_RAPS.html" target="view" class="nav-button">🧠 Saúde Mental</a>

        <div class="menu-section">Programas Sociais</div>
        <a href="PBF.HTML" target="view" class="nav-button">📅 Bolsa Família</a>
        <a href="CPMBV 2026.HTML" target="view" class="nav-button">💳 Cartão CPMBV</a>

        <div class="menu-section">Gestão</div>
        <a href="Registro de Atendimento (Planilha).html" target="view" class="nav-button">📝 Registro RMA</a>
    </div>
</div>

<div class="content">
    <iframe name="view" src="Territorio_13_Setembro.html"></iframe>
</div>

<script>
    const buttons = document.querySelectorAll('.nav-button');
    buttons.forEach(btn => {
        btn.addEventListener('click', function() {
            buttons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });
</script>
</body>
</html>
