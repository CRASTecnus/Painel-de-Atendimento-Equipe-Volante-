<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Equipe Volante</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-bg: #0d2137; 
            --accent-color: #00d4ff; 
            --bg-main: #f0f4f8;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body, html {
            height: 100%; margin: 0;
            font-family: 'Inter', sans-serif;
            /* Fundo Animado */
            background: linear-gradient(-45deg, #0d2137, #16314d, #001220, #0d2137);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; align-items: center; justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container { width: 100%; max-width: 440px; padding: 25px; position: relative; }

        .card-login {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            animation: fadeInScale 0.6s ease-out;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .card-header-custom {
            background-color: var(--sidebar-bg);
            padding: 45px 30px; text-align: center; color: white;
            position: relative;
        }

        /* Ícone de Escudo no Topo */
        .shield-icon {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5));
        }

        .card-header-custom h4 {
            font-weight: 800; letter-spacing: 2px;
            color: white; margin: 0; text-transform: uppercase;
            font-size: 1.25rem;
        }

        .card-header-custom p { 
            font-size: 0.75rem; opacity: 0.8; margin-top: 8px; 
            text-transform: uppercase; letter-spacing: 1px;
            font-weight: 400;
        }

        .card-body { padding: 45px 40px; }

        .form-label {
            font-size: 0.7rem; font-weight: 800; color: #475569;
            text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px;
        }

        .input-group {
            border-radius: 12px; overflow: hidden;
            transition: 0.3s; border: 2px solid #e2e8f0;
        }

        .input-group:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.1);
        }

        .input-group-text { 
            background-color: white; border: none; color: #94a3b8; 
            padding-left: 15px;
        }

        .form-control {
            border: none; padding: 14px 12px; font-size: 0.95rem;
            background-color: white; font-weight: 500;
        }

        .form-control:focus { box-shadow: none; background-color: white; }

        .btn-login {
            background: linear-gradient(135deg, var(--sidebar-bg) 0%, #1a3a5a 100%);
            color: white; border: none; padding: 16px; border-radius: 12px;
            font-weight: 700; width: 100%; margin-top: 15px;
            transition: all 0.4s ease; text-transform: uppercase; letter-spacing: 1.5px;
            box-shadow: 0 10px 20px rgba(13, 33, 55, 0.2);
        }

        .btn-login:hover {
            background: var(--accent-color);
            color: var(--sidebar-bg);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(0, 212, 255, 0.3);
        }

        .btn-login:active { transform: translateY(-1px); }

        .status-footer {
            text-align: center; margin-top: 25px;
            font-size: 0.75rem; color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        .accent-dot { color: var(--accent-color); }
    </style>

    <script>
        if (sessionStorage.getItem('logado') === 'true') {
            window.location.replace("index.html");
        }
    </script>
</head>
<body>

    <div class="login-container">
        <div class="card card-login">
            <div class="card-header-custom">
                <div class="shield-icon">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h4>Equipe Volante<span class="accent-dot">.</span></h4>
                <p>Monitoramento Territorial - Cristiana</p>
            </div>
            
            <div class="card-body">
                <form id="formLogin">
                    <div class="mb-4">
                        <label class="form-label">Identificação</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" id="usuario" class="form-control" placeholder="Usuário" required autocomplete="off">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Chave de Acesso</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" id="senha" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login">
                        Autenticar <i class="bi bi-chevron-right ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
        
        <div class="status-footer">
            <i class="bi bi-lock-fill me-2"></i>Ambiente Seguro & Monitorado
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = e.submitter;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Validando...';
            btn.style.opacity = '0.8';
            btn.disabled = true;

            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('senha').value;

            // Simulação de delay para experiência de sistema real
            setTimeout(() => {
                if(user === "cras" && pass === "volante2026") {
                    sessionStorage.setItem('logado', 'true');
                    window.location.replace("index.html"); 
                } else {
                    alert("Acesso negado: Credenciais inválidas.");
                    btn.innerHTML = 'Autenticar <i class="bi bi-chevron-right ms-2"></i>';
                    btn.style.opacity = '1';
                    btn.disabled = false;
                    document.getElementById('senha').value = "";
                }
            }, 800);
        });
    </script>

</body>
</html>
