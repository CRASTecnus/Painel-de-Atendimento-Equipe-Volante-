<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Equipe Volante</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #060b13;
            --sidebar-bg: #0a111e;
            --accent-glow: #00d4ff;
            --text-muted: #94a3b8;
        }

        body, html {
            height: 100%; margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #0d172a 0%, #060b13 100%);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: ""; position: absolute; width: 100%; height: 100%;
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.pattern");
            opacity: 0.1; z-index: -1;
        }

        .login-container { width: 100%; max-width: 400px; padding: 20px; z-index: 1; }

        .card-login {
            background: rgba(10, 17, 30, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.1);
            overflow: hidden;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header-custom {
            padding: 40px 30px 20px; text-align: center;
        }

        .shield-icon {
            font-size: 3rem;
            color: var(--accent-glow);
            margin-bottom: 10px;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(0, 212, 255, 0.6));
        }

        .card-header-custom h4 {
            font-weight: 800; letter-spacing: 3px;
            color: white; margin: 0; text-transform: uppercase;
            font-size: 1.1rem;
        }

        .card-header-custom p { 
            font-size: 0.65rem; color: var(--accent-glow); margin-top: 5px; 
            text-transform: uppercase; letter-spacing: 2px;
            font-family: 'JetBrains Mono', monospace;
        }

        .card-body { padding: 30px 40px 50px; }

        .form-label {
            font-size: 0.6rem; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
        }

        .input-group {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group:focus-within {
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            background: rgba(0, 212, 255, 0.05);
        }

        .input-group-text { 
            background: transparent; border: none; color: var(--accent-glow); 
            padding-left: 15px; font-size: 1.1rem;
        }

        .form-control {
            border: none; padding: 14px 12px; font-size: 0.9rem;
            background: transparent; color: white;
            font-weight: 400;
        }

        .form-control::placeholder { color: rgba(255, 255, 255, 0.2); }
        .form-control:focus { box-shadow: none; background: transparent; color: white; }

        .btn-login {
            background: var(--accent-glow);
            color: var(--primary-dark); border: none; padding: 15px; border-radius: 12px;
            font-weight: 800; width: 100%; margin-top: 10px;
            transition: 0.4s; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
            font-size: 0.85rem;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
            background: #fff;
        }

        .status-footer {
            text-align: center; margin-top: 25px;
            font-size: 0.6rem; color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
        }

        .accent-dot { color: var(--accent-glow); animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>

    <script>
        if (sessionStorage.getItem('logado') === 'true') {
            window.location.replace("index.html");
        }
    </script>
</head>
<body>

    <div class="login-container">
        <div class="card card-login">
            <div class="card-header-custom">
                <div class="shield-icon">
                    <i class="bi bi-fingerprint"></i>
                </div>
                <h4>EQUIPE <span style="font-weight: 300;">VOLANTE</span></h4>
                <p>Autenticação Necessária</p>
            </div>
            
            <div class="card-body">
                <form id="formLogin">
                    <div class="mb-4">
                        <label class="form-label">ID de Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" id="usuario" class="form-control" placeholder="Identifique-se..." required autocomplete="off">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Chave de Acesso</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" id="senha" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login" id="btnSubmit">
                        <span id="btnText">Iniciar Sessão</span> <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
        
        <div class="status-footer">
            <span class="accent-dot">●</span> CONEXÃO SEGURA ESTABELECIDA
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            
            btnText.innerHTML = 'VERIFICANDO...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('senha').value;

            // Simulação de delay para autenticação de sistema
            setTimeout(() => {
                if(user === "cras" && pass === "volante2026") {
                    sessionStorage.setItem('logado', 'true');
                    window.location.replace("index.html"); 
                } else {
                    alert("ACESSO NEGADO: As credenciais não conferem.");
                    btnText.innerHTML = 'INICIAR SESSÃO';
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    document.getElementById('senha').value = "";
                }
            }, 1200);
        });
    </script>

</body>
</html>
