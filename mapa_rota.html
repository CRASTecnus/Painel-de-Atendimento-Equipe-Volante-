<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logística Boa Vista - Otimizador de Rotas</title>
    <style>
        :root {
            --primary: #004a8d;
            --secondary: #6f42c1;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 20px; color: #333; }
        
        .card { 
            background: white; padding: 20px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; 
        }

        .header-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        
        label { display: block; font-weight: bold; font-size: 11px; color: var(--primary); margin-bottom: 5px; text-transform: uppercase; }
        input { 
            width: 100%; padding: 12px; border: 2px solid #edf2f7; border-radius: 8px; 
            box-sizing: border-box; font-size: 14px; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }

        .btn { 
            padding: 12px; border: none; border-radius: 8px; cursor: pointer; 
            font-weight: bold; color: white; transition: 0.2s; display: flex; 
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-add { background: var(--primary); width: 100%; margin-top: 10px; }
        .btn-opt { background: var(--secondary); width: 100%; font-size: 16px; margin: 15px 0; }
        .btn-maps { background: var(--success); margin-bottom: 10px; width: 100%; }
        .btn-clear { background: var(--danger); font-size: 12px; padding: 5px 10px; }

        .main-layout { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
        
        #listaStatus { 
            max-height: 450px; overflow-y: auto; border: 1px solid #eee; 
            border-radius: 8px; background: #fafafa; 
        }

        .route-item { 
            display: flex; align-items: center; padding: 10px; 
            border-bottom: 1px solid #eee; font-size: 13px; background: white;
        }
        .num-bola { 
            background: var(--primary); color: white; width: 22px; height: 22px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 10px; margin-right: 12px; flex-shrink: 0; 
        }

        .loading-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); z-index: 1000; 
            flex-direction: column; align-items: center; justify-content: center; 
        }

        @media (max-width: 800px) { .main-layout { grid-template-columns: 1fr; } }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">
        <div style="border: 4px solid #f3f3f3; border-top: 4px solid var(--secondary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
        <h3 style="color: var(--secondary); margin-top: 15px;">Otimizando sua rota...</h3>
        <p id="statusTxt">Calculando geolocalização em Boa Vista</p>
    </div>

    <div class="card no-print">
        <div class="header-grid">
            <div>
                <label>📍 Ponto de Partida (Sua Base):</label>
                <input type="text" id="partida" placeholder="Ex: Av. Ville Roy, 123">
            </div>
            <div>
                <label>🏘️ Bairro das Visitas (Foco):</label>
                <input type="text" id="bairro" placeholder="Ex: Caranã">
            </div>
        </div>
        <div>
            <label>🏠 Novo Endereço (Rua e Número):</label>
            <input type="text" id="novaRua" placeholder="Digite e aperte Enter" onkeypress="if(event.key==='Enter') adicionarPonto()">
            <button class="btn btn-add" onclick="adicionarPonto()">➕ ADICIONAR À LISTA</button>
        </div>
    </div>

    <div class="main-layout">
        <aside class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; color: var(--primary);">Roteiro (<span id="contador">0</span>/30)</h3>
                <button class="btn btn-clear no-print" onclick="limparTudo()">LIMPAR</button>
            </div>
            
            <div id="listaStatus" style="margin-top: 15px;">
                <p style="text-align: center; color: #999; padding: 20px;">Nenhum ponto adicionado.</p>
            </div>

            <div id="areaAcoes" style="display: none;">
                <button class="btn btn-opt no-print" onclick="otimizarPorDistancia()">⚡ ORGANIZAR POR DISTÂNCIA</button>
                <div id="botoesGoogleMaps"></div>
                <button class="btn" style="background: #555; width: 100%;" onclick="window.print()">📄 GERAR RELATÓRIO PDF</button>
            </div>
        </aside>

        <main class="card" style="padding: 10px;">
            <label style="padding: 10px;">Visualização Prévia:</label>
            <iframe id="mapaFrame" src="about:blank" width="100%" height="550" style="border:0; border-radius: 8px;"></iframe>
        </main>
    </div>

    <script>
        let listaPontos = [];

        function adicionarPonto() {
            const input = document.getElementById('novaRua');
            const valor = input.value.trim();
            
            if (valor && listaPontos.length < 30) {
                listaPontos.push(valor);
                input.value = '';
                atualizarInterface();
                document.getElementById('novaRua').focus();
            } else if (listaPontos.length >= 30) {
                alert("O limite para esta rota é de 30 paradas.");
            }
        }

        function atualizarInterface() {
            const container = document.getElementById('listaStatus');
            const contador = document.getElementById('contador');
            const areaAcoes = document.getElementById('areaAcoes');
            
            contador.innerText = listaPontos.length;
            
            if (listaPontos.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">Nenhum ponto adicionado.</p>';
                areaAcoes.style.display = 'none';
                return;
            }

            areaAcoes.style.display = 'block';
            container.innerHTML = '';
            
            listaPontos.forEach((rua, index) => {
                container.innerHTML += `
                    <div class="route-item">
                        <div class="num-bola">${index + 1}</div>
                        <div style="flex-grow: 1;">${rua}</div>
                        <button onclick="removerPonto(${index})" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;">✕</button>
                    </div>
                `;
            });
        }

        function removerPonto(i) {
            listaPontos.splice(i, 1);
            atualizarInterface();
            document.getElementById('botoesGoogleMaps').innerHTML = '';
        }

        async function otimizarPorDistancia() {
            const base = document.getElementById('partida').value;
            const bairro = document.getElementById('bairro').value;

            if (!base) return alert("Por favor, informe o Ponto de Partida!");
            if (listaPontos.length < 2) return alert("Adicione ao menos 2 pontos para otimizar.");

            document.getElementById('loader').style.display = 'flex';
            
            try {
                const todosEnderecos = [base, ...listaPontos];
                const coordenadas = [];

                // 1. Converter endereços em Lat/Log (Geocoding)
                for (let i = 0; i < todosEnderecos.length; i++) {
                    const query = `${todosEnderecos[i]}, ${bairro}, Boa Vista, RR, Brasil`;
                    document.getElementById('statusTxt').innerText = `Localizando: ${todosEnderecos[i]}`;
                    
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                    const data = await res.json();

                    if (data[0]) {
                        coordenadas.push({
                            nome: todosEnderecos[i],
                            lat: parseFloat(data[0].lat),
                            lon: parseFloat(data[0].lon)
                        });
                    }
                    // Delay para respeitar limite da API gratuita
                    await new Promise(r => setTimeout(r, 600));
                }

                if (coordenadas.length < 2) throw new Error("Não foi possível validar os endereços no mapa.");

                // 2. Algoritmo Vizinho Mais Próximo (TSP Heuristic)
                let rotaFinal = [];
                let disponiveis = [...coordenadas];
                let atual = disponiveis.shift(); // Remove a base para começar dela

                while (disponiveis.length > 0) {
                    let indiceMaisProximo = 0;
                    let menorDistancia = Infinity;

                    for (let i = 0; i < disponiveis.length; i++) {
                        const d = Math.sqrt(
                            Math.pow(disponiveis[i].lat - atual.lat, 2) + 
                            Math.pow(disponiveis[i].lon - atual.lon, 2)
                        );
                        if (d < menorDistancia) {
                            menorDistancia = d;
                            indiceMaisProximo = i;
                        }
                    }
                    atual = disponiveis.splice(indiceMaisProximo, 1)[0];
                    rotaFinal.push(atual.nome);
                }

                listaPontos = rotaFinal;
                atualizarInterface();
                gerarLinksMaps(base, bairro);
                
                // Atualiza iframe com o primeiro trecho
                const dFinal = listaPontos[0];
                document.getElementById('mapaFrame').src = `http://googleusercontent.com/maps.google.com/4{encodeURIComponent(base)}&daddr=${encodeURIComponent(dFinal)}&output=embed`;

            } catch (err) {
                alert("Erro: " + err.message);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function gerarLinksMaps(base, bairro) {
            const areaLinks = document.getElementById('botoesGoogleMaps');
            areaLinks.innerHTML = '<label style="margin-top:10px">Enviar para o Celular:</label>';
            
            // Google permite 9 waypoints intermediários + 1 destino = 10 paradas por link
            const paradasPorLink = 9;
            let inicioTrecho = base;

            for (let i = 0; i < listaPontos.length; i += paradasPorLink) {
                const trecho = listaPontos.slice(i, i + paradasPorLink);
                const destinoTrecho = trecho[trecho.length - 1];
                const intermediarios = trecho.slice(0, -1);

                const waypointsStr = intermediarios
                    .map(p => encodeURIComponent(p + ', ' + bairro + ', Boa Vista, RR'))
                    .join('|');

                const url = `https://www.google.com.br/maps/dir/?api=1&origin=${encodeURIComponent(inicioTrecho + ', ' + bairro + ', Boa Vista, RR')}&destination=${encodeURIComponent(destinoTrecho + ', ' + bairro + ', Boa Vista, RR')}&waypoints=${waypointsStr}&travelmode=driving`;
                
                const btn = document.createElement('button');
                btn.className = 'btn btn-maps';
                btn.innerHTML = `🚀 ABRIR TRECHO ${Math.floor(i/paradasPorLink) + 1} (${i+1} ao ${Math.min(i+paradasPorLink, listaPontos.length)})`;
                btn.onclick = () => window.open(url, '_blank');
                
                areaLinks.appendChild(btn);
                
                // O próximo link começa onde este terminou
                inicioTrecho = destinoTrecho;
            }
        }

        function limparTudo() {
            if(confirm("Deseja apagar toda a lista?")) {
                listaPontos = [];
                atualizarInterface();
                document.getElementById('botoesGoogleMaps').innerHTML = '';
                document.getElementById('mapaFrame').src = 'about:blank';
            }
        }

        // Estilo da animação
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
